<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:16px}.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);width:100%;margin-bottom:2px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.BraciDesignSystem_8fd649;
function Demo(){const [a,setA]=React.useState(true),[m,setM]=React.useState('pickup'),[v,setV]=React.useState(true);
return <>
<div className="row">
<div style={{width:210}}><Input label="Name on the order" placeholder="e.g. Nadia" /></div>
<div style={{width:210}}><Input label="Phone" defaultValue="07" error="We text you when it's boxed." /></div>
<div style={{width:210}}><Select label="Pickup time" options={['18:15','18:30','18:45']} placeholder="Choose a slot" /></div>
</div>
<div className="row">
<div style={{width:320}}><Input label="Notes for the kitchen" multiline placeholder="Allergies, no chilli, extra basil…" /></div>
<div style={{display:'flex',flexDirection:'column',gap:12,paddingTop:18}}>
<Checkbox checked={a} onChange={()=>setA(!a)} label="Text me when it leaves the oven" description="One message, no marketing." />
<Radio name="c" checked={m==='pickup'} onChange={()=>setM('pickup')} label="Pickup" description="Ready in 20 minutes" />
<Radio name="c" checked={m==='table'} onChange={()=>setM('table')} label="Eat in" />
<Switch checked={v} onChange={()=>setV(!v)} label="Vegetarian only" />
</div></div>
</>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
